<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDews - Command Center Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="container mx-auto p-8">
        <header class="mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-teal-400">IDews: Intelligent Dam Early Warning System</h1>
            <p class="text-slate-400">Team: Nabd Qatra (نبض قطرة) | Arab Youth Space Hackathon</p>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-lg font-semibold text-teal-300 mb-2">Dam Water Level</h3>
                <p class="text-4xl font-bold text-emerald-400">74.2%</p>
                <p class="text-sm text-slate-400 mt-2">Status: Normal / Monitored</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-lg font-semibold text-teal-300 mb-2">Predictive Lead Window</h3>
                <p class="text-4xl font-bold text-blue-400">14 Days</p>
                <p class="text-sm text-slate-400 mt-2">Early warning active</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-lg font-semibold text-teal-300 mb-2">Risk Level</h3>
                <p class="text-4xl font-bold text-green-400">LOW</p>
                <p class="text-sm text-slate-400 mt-2">No immediate discharge needed</p>
            </div>
        </div>
    </div>
</body>
</html>
